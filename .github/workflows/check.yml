name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: quantum-seal-extension
          persist-credentials: false
      # The extension builds against the core SDK next to it (file:../quantum-seal-wallet),
      # checked out at the reviewed commit pinned in CORE_REF, never the default branch.
      - name: Read the pinned core commit
        id: core
        run: |
          ref="$(tr -d '[:space:]' < quantum-seal-extension/CORE_REF)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "CORE_REF must be a full commit hash"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # CORE_DEPLOY_KEY is a read-only deploy key on the private core repository.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qcommit/quantum-seal-wallet
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: quantum-seal-wallet
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: quantum-seal-wallet/.nvmrc
      - run: npm ci --ignore-scripts --no-fund
        working-directory: quantum-seal-wallet
      # No install scripts: esbuild runs from its platform package (an optional dependency).
      - run: npm ci --ignore-scripts --no-fund
        working-directory: quantum-seal-extension
      - run: npm test
        working-directory: quantum-seal-extension
      # --release refuses a core checkout that is not exactly CORE_REF.
      - run: npm run build -- --release
        working-directory: quantum-seal-extension
      - name: Check the built extension
        working-directory: quantum-seal-extension
        run: |
          node -e "const m=require('./dist/manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version)"
          node -e "const b=require('./dist/build-info.json'); if(!b.core.matchesPin) process.exit(1); console.log('core', b.core.commit)"
          ls -la dist
      # Renders every UI state from fixtures (no chain, no network) and fails on any axe-core
      # accessibility violation, failed interaction step or page error.
      - name: Install Chromium for the UI check
        working-directory: quantum-seal-extension
        run: npx --no-install playwright-core install --with-deps chromium
      - name: UI check (every screen state, accessibility scan)
        working-directory: quantum-seal-extension
        run: npm run visual

  # The full end-to-end run: a local validator with the wallet program built from the pinned
  # core commit (checked against its recorded canonical hash), driven through the built
  # extension in Chromium.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: quantum-seal-extension
          persist-credentials: false
      - name: Read the pinned core commit
        id: core
        run: |
          ref="$(tr -d '[:space:]' < quantum-seal-extension/CORE_REF)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "CORE_REF must be a full commit hash"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qcommit/quantum-seal-wallet
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: quantum-seal-wallet
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: quantum-seal-wallet/.nvmrc
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Install Agave 3.1.10 (validator, cargo-build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the wallet program and check its canonical hash
        working-directory: quantum-seal-wallet
        run: |
          bash scripts/build-sbf.sh
          (cd target/deploy && sha256sum --check ../../PROGRAM_SHA256)
      - name: Check the vendored associated-token program
        working-directory: quantum-seal-extension/e2e/fixtures
        run: echo "e5e7aed11ad3969eea2aa76c8b4d2e73ea25be7e6b5cce989b7710cf5452496e  spl_associated_token_account-1.1.1.so" | sha256sum --check
      - run: npm ci --ignore-scripts --no-fund
        working-directory: quantum-seal-wallet
      - run: npm ci --ignore-scripts --no-fund
        working-directory: quantum-seal-extension
      - name: Install Chromium
        working-directory: quantum-seal-extension
        run: npx --no-install playwright-core install --with-deps chromium
      - name: End-to-end run
        working-directory: quantum-seal-extension
        env:
          QS_SOLANA_BIN: /home/runner/.local/share/solana/install/active_release/bin
        run: npm run build && npm run e2e
